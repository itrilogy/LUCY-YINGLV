<!doctype html>
<html lang="zh-CN" data-product="yinglv" data-theme="dark" data-density="comfortable">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>应律 · YingLv (BeatStream) · 循声应律，逐拍成画 · 鹿溪联合创新实验室</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/src/studio.css" />
  <style>
    /* =========================================================================
       应律 · YingLv (BeatStream) 工作台样式层
       严格遵循《鹿溪设计范式 · LUXI Design System v1.1.1》(LUCY-DESIGN)
       1. 消费 tokens.css 三层变量（core -> semantic -> product），零游离色
       2. 双标等大（产品方标 yinglv.svg × 实验室符号标 #luxi-symbol-mark，无写实主标）
       3. 面字分离安全对比度铁律（WCAG AAA: --text-ok / --text-warn / --text-danger / --text-info）
       4. 五档标准控件高度（--h-xs ~ --h-xl）与每屏唯一鹿溪绿实底 Primary 按钮
       ========================================================================= */

    html, body {
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-body);
    }

    /* 顶部导航 Shell (56px 标准顶栏 + 毛玻璃浮层) */
    .top-shell {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      background: var(--gradient-glass);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-bottom: 1px solid var(--border-line);
      box-shadow: var(--shadow-xs);
    }
    .top-nav {
      max-width: var(--container, 1440px);
      margin: 0 auto;
      min-height: var(--header-h, 56px);
      padding: var(--space-2) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    /* 品牌双标簇：产品方标 × 实验室符号标 严格并排等大 (36×36) */
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .brand-marks-pair {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: block;
    }
    .brand-mark.luxi-symbol {
      color: var(--luxi-green);
    }
    [data-theme="dark"] .brand-mark.luxi-symbol,
    [data-theme="ink"] .brand-mark.luxi-symbol {
      color: var(--origin-white);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-title {
      font-size: var(--fs-body-lg);
      font-weight: var(--fw-bold);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      letter-spacing: var(--ls-tight);
    }
    .brand-version {
      font-size: var(--fs-micro);
      font-family: var(--font-mono);
      background: var(--bg-sunken);
      color: var(--text-info);
      padding: 1px var(--space-2);
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-line);
    }
    .brand-subtitle {
      font-size: var(--fs-micro);
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: var(--ls-wide);
    }

    /* 导航场景切换 (Capsule / Tablist) */
    .nav-tabs {
      display: flex;
      gap: var(--space-1);
      align-items: center;
      flex-wrap: wrap;
      background: var(--bg-sunken);
      padding: var(--space-1);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    .nav-kicker {
      font-size: var(--fs-micro);
      letter-spacing: var(--ls-wide);
      color: var(--text-muted);
      padding: 0 var(--space-2);
    }
    .nav-tab-btn {
      height: var(--h-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      padding: 0 var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--fs-small);
      font-weight: var(--fw-medium);
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-standard);
    }
    .nav-tab-btn:hover {
      color: var(--text-primary);
      background: var(--bg-card);
    }
    .nav-tab-btn.active {
      background: var(--bg-card);
      color: var(--text-info);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-xs);
    }

    /* 筛选胶囊 */
    .filter-row {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      flex-wrap: wrap;
      margin-top: var(--space-3);
    }
    .filter-chip {
      height: var(--h-xs);
      border: 1px solid var(--border-line);
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-pill);
      padding: 0 var(--space-3);
      font-size: var(--fs-caption);
      cursor: pointer;
      transition: all var(--dur-instant) var(--ease-standard);
    }
    .filter-chip:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .filter-chip.active {
      color: var(--text-info);
      border-color: var(--luxi-cyan);
      background: var(--bg-sunken);
    }

    /* 歌词词级校对网格 */
    .lyric-word-grid {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .lyric-word {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      min-width: 124px;
      font-size: var(--fs-caption);
      font-variant-numeric: tabular-nums;
    }
    .lyric-word.low em {
      color: var(--text-danger);
      font-style: normal;
      font-weight: var(--fw-semibold);
    }
    .lyric-word .input-text {
      height: var(--h-xs);
      padding: 0 var(--space-2);
    }

    /* 控制栏与五档标准按钮体系 (§6.1 & §6.2) */
    .controller-bar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .btn {
      height: var(--h-md);
      padding: 0 var(--space-4);
      border-radius: var(--radius-sm);
      font-size: var(--fs-caption);
      font-weight: var(--fw-semibold);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: all var(--dur-fast) var(--ease-standard);
      border: 1px solid transparent;
      text-decoration: none;
      white-space: nowrap;
    }
    /* Primary：全屏唯一主行动，鹿溪绿实底 + 源启白字 */
    .btn-primary {
      background: var(--color-primary);
      color: #F5F7FA;
      border-color: var(--color-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      text-decoration: none;
      box-shadow: var(--shadow-sm);
    }
    /* Secondary：次行动，描边 + 文本主色 */
    .btn-secondary {
      background: var(--bg-raised);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      border-color: var(--color-primary);
      color: var(--text-info);
    }
    /* Preset：金标预设按钮，面字分离使用 --text-warn */
    .btn-preset {
      background: var(--bg-sunken);
      border-color: rgba(241, 196, 15, 0.40);
      color: var(--text-warn);
    }
    .btn-preset:hover {
      border-color: var(--luxi-gold);
      background: var(--bg-raised);
    }
    /* Accent：工程执行动作按钮 */
    .btn-accent {
      background: var(--bg-raised);
      border-color: var(--color-primary);
      color: var(--text-ok);
    }
    .btn-accent:hover {
      background: var(--color-primary);
      color: #F5F7FA;
    }
    /* Outline / Ghost */
    .btn-outline {
      background: transparent;
      border-color: var(--border-line);
      color: var(--text-secondary);
    }
    .btn-outline:hover {
      border-color: var(--luxi-cyan);
      color: var(--text-info);
    }

    /* 主视口布局 */
    .viewport {
      max-width: var(--container, 1440px);
      margin: 0 auto;
      padding: var(--space-8) var(--space-6) var(--space-16);
    }

    /* 产品定义横幅 (Hero Card) */
    .product-hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-lg);
      padding: var(--space-6) var(--space-8);
      margin-bottom: var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-8);
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }
    .hero-left { max-width: 820px; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      letter-spacing: var(--ls-widest);
      color: var(--text-ok);
      margin: 0 0 var(--space-2) 0;
      font-weight: var(--fw-semibold);
      text-transform: uppercase;
    }
    .hero-title {
      font-size: var(--fs-h1);
      line-height: var(--lh-h1);
      font-weight: var(--fw-bold);
      margin: 0 0 var(--space-2) 0;
      color: var(--text-primary);
    }
    .hero-desc {
      font-size: var(--fs-small);
      color: var(--text-secondary);
      line-height: var(--lh-body);
      margin: 0;
    }
    .hero-stats {
      display: flex;
      gap: var(--space-6);
      background: var(--bg-sunken);
      padding: var(--space-4) var(--space-6);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      font-variant-numeric: tabular-nums;
    }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-num {
      font-family: var(--font-mono);
      font-size: var(--fs-h2);
      font-weight: var(--fw-bold);
      color: var(--text-info);
    }
    .stat-label {
      font-size: var(--fs-micro);
      color: var(--text-muted);
      margin-top: var(--space-1);
    }

    /* 区块工具栏 */
    .section-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-5);
      background: var(--bg-card);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-line);
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .toolbar-badge {
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      color: var(--text-ok);
      background: var(--bg-sunken);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-line);
    }
    .toolbar-meta {
      font-size: var(--fs-caption);
      color: var(--text-muted);
      margin-left: var(--space-3);
      font-variant-numeric: tabular-nums;
    }
    .toolbar-right {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    /* 镜头切片网格卡片 */
    .cuts-grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
    }
    @media (max-width: 1280px) { .cuts-grid-container { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 960px) { .cuts-grid-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .cuts-grid-container { grid-template-columns: 1fr; } }

    .cut-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      transition: all var(--dur-fast) var(--ease-standard);
    }
    .cut-card-item:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
      background: var(--bg-raised);
    }
    .cut-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-variant-numeric: tabular-nums;
    }
    .cut-index-badge {
      font-family: var(--font-mono);
      font-size: var(--fs-caption);
      font-weight: var(--fw-bold);
      color: var(--text-info);
      background: var(--bg-sunken);
      padding: 2px var(--space-2);
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-subtle);
    }
    .cut-time-range {
      font-family: var(--font-mono);
      font-size: var(--fs-micro);
      color: var(--text-muted);
    }
    .cut-dur-tag {
      font-size: var(--fs-micro);
      font-family: var(--font-mono);
      color: var(--text-secondary);
      background: var(--bg-sunken);
      padding: 1px var(--space-2);
      border-radius: var(--radius-xs);
    }
    .cut-lyric-box {
      font-size: var(--fs-small);
      font-weight: var(--fw-semibold);
      color: var(--text-primary);
      line-height: 1.45;
      min-height: 38px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cut-plugin-selector-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .select-label {
      font-size: var(--fs-micro);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* 输入与下拉选择器 (§6.1 标准令牌) */
    .cut-plugin-select,
    .layer-select,
    .input-text {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      border-radius: var(--radius-xs);
      transition: border-color var(--dur-instant) var(--ease-standard), box-shadow var(--dur-instant) var(--ease-standard);
    }
    .cut-plugin-select:focus-visible,
    .layer-select:focus-visible,
    .input-text:focus-visible,
    .code-textarea:focus-visible {
      border-color: var(--input-border-focus);
      box-shadow: var(--shadow-focus);
      outline: none;
    }
    .cut-plugin-select {
      flex: 1;
      height: var(--h-sm);
      font-weight: var(--fw-semibold);
      padding: 0 var(--space-2);
      font-size: var(--fs-caption);
      color: var(--text-ok);
    }

    /* 5 层分层正交装配器 */
    .layered-assembler-box {
      background: var(--bg-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--fs-micro);
    }
    .layer-label {
      width: 60px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .layer-select {
      flex: 1;
      height: var(--h-xs);
      font-size: var(--fs-micro);
      padding: 0 var(--space-2);
    }
    .btn-auto-assemble,
    .btn-model-assemble-one,
    .btn-write-shot-layer {
      height: var(--h-xs);
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      color: var(--text-secondary);
      font-size: var(--fs-micro);
      padding: 0 var(--space-2);
      border-radius: var(--radius-xs);
      cursor: pointer;
      font-weight: var(--fw-semibold);
      transition: all var(--dur-instant) var(--ease-standard);
    }
    .btn-auto-assemble {
      color: var(--text-warn);
      border-color: rgba(241, 196, 15, 0.35);
      margin-top: var(--space-1);
    }
    .btn-auto-assemble:hover,
    .btn-model-assemble-one:hover,
    .btn-write-shot-layer:hover {
      border-color: var(--luxi-cyan);
      color: var(--text-info);
      background: var(--bg-raised);
    }

    /* 标签药丸（面字分离安全对比度） */
    .cut-tags-flow {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
    }
    .tag-pill {
      font-size: var(--fs-micro);
      font-family: var(--font-mono);
      padding: 2px var(--space-2);
      border-radius: var(--radius-xs);
      background: var(--bg-sunken);
      border: 1px solid var(--border-subtle);
    }
    .tag-pill.style { color: var(--text-info); }
    .tag-pill.imagery { color: var(--text-warn); }

    .cut-card-actions {
      display: flex;
      gap: var(--space-2);
      margin-top: auto;
    }
    .btn-slice-play,
    .btn-slice-newtab {
      height: var(--h-xs);
      padding: 0 var(--space-3);
      border-radius: var(--radius-xs);
      font-size: var(--fs-micro);
      font-weight: var(--fw-medium);
      cursor: pointer;
      transition: all var(--dur-instant) var(--ease-standard);
    }
    .btn-slice-play {
      background: var(--bg-sunken);
      border: 1px solid var(--border-line);
      color: var(--text-secondary);
    }
    .btn-slice-play:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .btn-slice-newtab {
      background: var(--bg-sunken);
      border: 1px solid var(--border-strong);
      color: var(--text-info);
      flex: 1;
      text-align: center;
    }
    .btn-slice-newtab:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #F5F7FA;
    }

    /* 视效库网格 */
    .arsenal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
    }
    @media (max-width: 960px) { .arsenal-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .arsenal-grid { grid-template-columns: 1fr; } }

    .arsenal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .arsenal-title-zh {
      font-size: var(--fs-body-lg);
      font-weight: var(--fw-bold);
      color: var(--text-primary);
    }
    .arsenal-title-en {
      font-size: var(--fs-micro);
      color: var(--text-info);
    }
    .arsenal-desc {
      font-size: var(--fs-caption);
      color: var(--text-secondary);
      line-height: 1.55;
      margin: 0;
      min-height: 36px;
    }
    .arsenal-actions {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }
    .btn-sandbox,
    .btn-promote {
      flex: 1;
      height: var(--h-sm);
      background: var(--bg-sunken);
      border: 1px solid var(--border-strong);
      color: var(--text-info);
      padding: 0 var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--fs-caption);
      font-weight: var(--fw-semibold);
      cursor: pointer;
    }
    .btn-sandbox:hover,
    .btn-promote:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #F5F7FA;
    }

    /* 通用卡片与表单 */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      box-shadow: var(--shadow-xs);
    }
    .card-title {
      font-size: var(--fs-h3);
      font-weight: var(--fw-bold);
      color: var(--text-primary);
      margin: 0 0 var(--space-2) 0;
    }
    .card-desc {
      font-size: var(--fs-small);
      color: var(--text-secondary);
      line-height: var(--lh-body);
      margin: 0 0 var(--space-4) 0;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-6);
    }
    @media (max-width: 960px) { .grid-2 { grid-template-columns: 1fr; } }

    .form-group { margin-bottom: var(--space-4); }
    .form-group label {
      display: block;
      font-size: var(--fs-caption);
      color: var(--text-muted);
      margin-bottom: var(--space-2);
    }
    .input-text {
      width: 100%;
      height: var(--h-md);
      padding: 0 var(--space-3);
      font-size: var(--fs-small);
    }
    .tag-cluster-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .tag-def-item {
      background: var(--bg-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: var(--space-3) var(--space-4);
    }
    .tag-def-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-1);
    }
    .tag-def-name { font-weight: var(--fw-bold); font-size: var(--fs-small); }
    .tag-def-en { font-size: var(--fs-micro); color: var(--text-muted); }
    .tag-def-desc { font-size: var(--fs-caption); color: var(--text-secondary); }
    .match-result-box {
      background: var(--bg-sunken);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: var(--space-3) var(--space-4);
    }
    .code-textarea {
      width: 100%;
      min-height: 160px;

      border: 1px solid var(--input-border);

      font-size: var(--fs-caption);
      padding: var(--space-3);
      border-radius: var(--radius-xs);
      resize: vertical;
    }

      max-width: var(--container, 1440px);

      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: var(--fs-caption);
      flex-wrap: wrap;
      gap: var(--space-4);
    }
  </style>
</head>
